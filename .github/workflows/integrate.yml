name: Node CI 

on: 
  pull_request:
    branches: [master]

jobs:
  test_pull_request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
